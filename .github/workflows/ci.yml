name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run linter
        run: npm run lint

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npm run db:generate -w backend
        env:
          # prisma generate only reads the schema — no live DB connection needed
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/project_manager"

      - name: Run backend tests
        run: npm test -w backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/project_manager"
          JWT_SECRET: "ci_jwt_secret_for_testing"

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Panda CSS styled-system
        # styled-system/ is gitignored so must be regenerated in CI before tests run
        run: npm run prepare -w frontend

      - name: Run frontend tests
        run: npm test -w frontend
