name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run linter
        run: npm run lint

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npm run db:generate -w backend
        env:
          # prisma generate only reads the schema — no live DB connection needed
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/project_manager"

      - name: Run backend tests
        run: npm test -w backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/project_manager"
          JWT_SECRET: "ci_jwt_secret_for_testing"

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Panda CSS styled-system
        # styled-system/ is gitignored so must be regenerated in CI before tests run
        run: npm run prepare -w frontend

      - name: Run frontend tests
        run: npm test -w frontend

  e2e-tests:
    name: E2E & Accessibility Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for frontend to be ready
        run: |
          echo "Waiting for frontend at http://localhost:5173..."
          timeout 180 bash -c 'until curl -sf http://localhost:5173 > /dev/null 2>&1; do sleep 5; done'
          echo "Frontend is ready."

      - name: Run Playwright E2E + Axe-core accessibility tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Tear down services
        if: always()
        run: docker compose down
